[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-deploy-agent"
version = "0.0.1"
description = "Nemotron-driven agent that optimizes and benchmarks models on a Raspberry Pi 4 within latency and RAM budgets."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "prometheus-client>=0.20",
  "pydantic>=2.6",
  "httpx>=0.27",
  "langgraph>=0.2",
  "opentelemetry-api>=1.24",
  "opentelemetry-sdk>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4", "onnx>=1.16", "onnxruntime>=1.18", "numpy>=1.26", "psutil>=5.9", "sympy>=1.12", "mlflow>=2.14", "opentelemetry-exporter-otlp-proto-http>=1.24", "tritonclient[grpc]>=2.40"]
speech = ["huggingface_hub>=0.23", "datasets>=2.18,<4", "soundfile>=0.12"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts", "."]

[tool.ruff]
line-length = 100
